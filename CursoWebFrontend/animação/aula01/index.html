 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>

     <style>
          @keyframes anda{
               from {
                    transform: translateX(0);
                    background-color: yellow;

                    /*height: 50px;/*para animar deve ter o height no 0 50 100 ou na div e em algum dos 3*/
                    
               }
               50%{
                    background-color: lightgreen;
                    /*height: 100px;*/
               }
               to{
                    transform: translateX(300px);
                    background-color: blue;
                   /* height: 50px;*/
               }
          }

          @keyframes altura {
              /* 0%,
               100%{
                    height: 80px;
               }
               20%, 
               80%{
                    height: 150px;
               }*/
               0%{
                    height: 80px;
               }
               100% {
                    height: 120px;
               }
               
          }

          @keyframes largura {
               0% {
                    width: 100px;
               }
               100%{
                    width:400px;
               }
               
          }
          .anima {
               outline: 3px solid green;
               width: 400px;

          }
          .anima div{
               width: 100px;
               height: 50px;
               background-color: #ccc;
               margin-bottom: 10px;
          }
          .anima div:nth-child(1){
               animation-name: anda;
               animation-duration: 2s;
               animation-iteration-count: 2; /*infinite podemos colocar*/
               animation-timing-function: ease-in;
               animation-direction:alternate;
          }
           .anima div:nth-child(2){
               animation: anda 2s ease-in-out 2s infinite alternate ;
               /*animation: anda 2s ease-in-out 2s infinite alternate forwards running;*/
               animation-fill-mode:forwards ;
               /*backwrds= coloca o 0% antes dele começar ou seja a cor blue*/
             
               /*ruming é normal
               */
          }
          .anima div:nth-child(2):hover{
               animation-play-state: paused; /*quando passa o mouse ele pausa*/
          }
          .anima div:nth-child(3){
               animation: 
               altura 1s linear  infinite alternate,
               anda 2s ease-in-out infinite alternate ;
               will-change: height; /*para melhorara performace, mas nao usar mto*/
          }
          /*1s 0s .5s

          no delay pode ter 0s mas no duration nao*/

          .anima div:nth-child(4){
               animation: largura 5s ;
               animation-timing-function: steps(5);
               /*steps (5, jump-end) pula a ultima
               (5, jump-start) pula a primeira */
          }
          .anima div:nth-child(5){
               animation: largura 5s ;
               animation-timing-function: steps(5, jump-start);
               /*steps (5, jump-end) pula a ultima
               (5, jump-start) pula a primeira */
          }
          .anima div:nth-child(6){
               animation: largura 5s ;
               animation-timing-function: steps(5, jump-none);
               
          }
          .anima div:nth-child(7){
               animation: largura 5s ;
               animation-timing-function: steps(5, jump-both);
               /*pula o primeiro e o ultimo passo */
          }
     </style>
 </head>
 <body>
     <div class="anima">
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4 jump-end</div>
          <div>5 jump-start</div>
          <div>6 jump-none</div>
          <div>7 jump-both</div>
     </div>
 </body>
 </html>
