 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>

     <style>
          @keyframes anda{
               from {
                    transform: translateX(0);
                    background-color: yellow;
                    
               }
               50%{
                    background-color: lightgreen;
               }
               to{
                    transform: translateX(300px);
                    background-color: blue;
               }
          }
          .anima {
               outline: 3px solid green;
               width: 400px;

          }
          .anima div{
               width: 100px;
               height: 50px;
               background-color: #ccc;
               margin-bottom: 10px;
          }
          .anima div:nth-child(1){
               animation-name: anda;
               animation-duration: 2s;
               animation-iteration-count: 2; /*infinite podemos colocar*/
               animation-timing-function: ease-in;
               animation-direction:alternate;
          }
           .anima div:nth-child(2){
               animation: anda 2s ease-in-out 2s infinite alternate ;
               /*animation: anda 2s ease-in-out 2s infinite alternate forwards running;*/
               animation-fill-mode:forwards ;
               /*backwrds= coloca o 0% antes dele começar ou seja a cor blue*/
             
               /*ruming é normal
               */
          }
          .anima div:nth-child(2):hover{
               animation-play-state: paused; /*quando passa o mouse ele pausa*/
          }
     </style>
 </head>
 <body>
     <div class="anima">
          <div>1</div>
          <div>1</div>
     </div>
 </body>
 </html>
