<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenoji</title>

  <style>
    /* Scroll suave */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 70px; /* altura do nav fixo */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Nav fixo */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #ccc5;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 2rem;
      z-index: 1000;
    }

    nav a {
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
      color: black;
    }

    /* Seções */
    .scroll-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5em;
    }

    /* Gradiente de fundo */
    body {
      background-image: radial-gradient(ellipse at 0 0, #fff8ce, #ffb61d);
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* Wrapper e conteúdo */
    #wrapper {
      width: 90%;
      max-width: 1340px;
      margin: auto;
    }

    header img {
      max-width: 150px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#projetos">Projetos</a>
    <a href="#contatos">Contatos</a>
  </nav>

  <div id="wrapper">
    <div class="scroll-page" id="home">
      <h1>Página Inicial</h1>
    </div>

    <div class="scroll-page" id="projetos">
      <h2>Projetos</h2>
    </div>

    <div class="scroll-page" id="contatos">
      <h2>Contatos</h2>
    </div>
  </div>
  <script>
  const navLinks = document.querySelectorAll('nav a');
  const navHeight = 70; // altura do nav fixo

  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const targetId = link.getAttribute('href').substring(1);
      const targetEl = document.getElementById(targetId);

      window.scrollTo({
        top: targetEl.offsetTop - navHeight,
        behavior: 'smooth' // garante animação visível
      });
    });
  });
</script>

</body>

</html>
