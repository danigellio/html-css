<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Grid lines nomeadas</title>
     <style>
          .gridContainer{
               width: 100vw;
               height: 70vh;
               background-color: #ccc;
          }
          .gridItem {
               background-color: orange;
               padding: 15px;
               font-family: sans-serif;
          }
          /*GRID*/
          .gridContainer{
               display: grid;
               grid-template-columns:repeat(3, [col-start] 1fr [col-end]);

               grid-template-rows: [header-start] 75px [header-end nav-start] 50px [nav-end main-start] 1fr [main-end footer-start] 50px [footer-end]; 
               gap: 1em;
               
          }
          .header{
              grid-column: col-start 1 / col-end 3;
          }
         .nav{
        grid-column: col-start 1 / col-end 2;
         }
         .aside{
          grid-row: nav-start / footer-end ;
          grid-column:  col-start 3; /*fica com todas as col3*/
          z-index: 1;
         }
         .main{
          grid-row: main;
          grid-column:  col-start 1 / col-end 2;

         }
         .footer{
          grid-column: col-start 1 / span 2; /*ele comeca no 1 e expande 2*/          grid-row:  footer;
          background-color: rgba(0, 0, 0, .5);
         }
     </style>
</head>
<body>
     <div class="gridContainer">
          <header class="header gridItem">Header</header>
          <nav class="nav gridItem">Nav</nav>
          <aside class="aside gridItem">Aside</aside>
          <main class="main gridItem">
               main
          </main>
          <footer class="footer gridItem">Footer</footer>
     </div>
</body>
</html>
