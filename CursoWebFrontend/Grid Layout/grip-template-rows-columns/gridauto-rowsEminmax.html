<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Grid lines nomeadas</title>
     <style>
          .gridContainer{
               display: grid;
               width: 90%;
               
               background-color: #ccc;
               gap: 10px;

               /*temos auto-fit e auto-fill para adptar automaticamente o tamanho e nao sobrar
               Auto-fill vai fazer com que novas colunas sejam gerdas automaticamente , mesmo q n tenha o numero suficiente de grid item, é como se ele criasse as colunas e reservasse o espaço dela ali no meu sistema grid
               Auto-fit, ele vai sempre distribuir todas as colunas que ele tem,ele fica no minimo 150px e no maximo uma fracao*/
               grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
               grid-auto-rows: minmax(100px, auto); /*todas linhas que voce for criando, ela tera 100px automatico,vc pode ir adicionando*/

               /* minmax,para nao eceder o tamanho, caso tenho algo no conteudo, 100 é o valor minimo e auto é o valor maximo*/

          }
          .gridItem {
               background-color: orange;
               padding: 15px;
               font-family: sans-serif;
          }
         
         
     </style>
</head>
<body>
     <div class="gridContainer">
          
          <div class="gridItem">1</div>
          <div class="gridItem">2</div>
          <div class="gridItem">3</div>
          <div class="gridItem">1</div>
          <div class="gridItem">2</div>
          <div class="gridItem">3</div>
          <div class="gridItem">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quisquam, veritatis? Lorem ipsum dolor sit amet consectetur adipisicing elit. Libero, unde.</div>
          <div class="gridItem">2</div>
          <div class="gridItem">3</div>
          
          
     </div>
</body>
</html>
