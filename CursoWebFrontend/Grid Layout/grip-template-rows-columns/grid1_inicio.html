<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        .gridContainer {
            width: 300px;
            background: #ccc;
        }

        .gridItem {
            background: #999;
            font-size: 2em;
            font-family: sans-serif;
            padding: 5px 15px;
        }

        .gridItem:nth-child(even) {
            background: #999;
            color: white;
        }

        .gridItem:nth-child(odd) {
            background: #eee;
        }

        /*Grid*/
        .gridContainer{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            /*ou 1fr 2fr 3fr ou 50px 1fr 1fr ou 50px repeat(2,fr) ou repeat(3, 1fr) etc..*/

            /* 100px 100px 100px; ele tem 300px,e ele dividiu em 3
            podemos colocar repeat(2, 100px) 100px; */
            grid-template-rows: 150px 150px; /*cada linha tem essa altura*/

            row-gap: 10px;
            column-gap: 10px;
            /*gap: 10px 20px*/
        }
        .gridItem:nth-child(1){
            background-color: yellow;
           /* grid-row-start: 1;
            grid-row-end: 2;*/
            grid-row: 1 / 2;/*atalho*/
            /*grid-column: 1 / -1;*/
            grid-column-start: 1;
            grid-column-end: -2;/*pode ser -2 por exemplo*/
            /*aqui ele mescla, vai da coluna 1 ate a 3, as linhas 1 e 2*/
        }
        .gridItem:nth-child(5){
            grid-row: 1 /-1; /*comeca na um e vai ate a ultima*/
            grid-column: 4 /-1;
            /*poremos colocar somente 4, pq por padrao ele expande 1, e so temos mais uma coluna que e -1*/
        }
        .gridItem:nth-child(6){
            grid-column: 1 / span 3; /*ela espande 3x
            , podemos colocor somente span3, pq por padrao ele comeca com 1*/
        }

        .gridItem:nth-child(4){
            grid-area: 2 / 3 /-1 / 4;
            /*atalho para   grid row start
                            grid column star
                            grid row end
                            grid column end*/
            
        }
    </style>
</head>

<body>
    <h2>Grid Layout</h2>


    <div class="gridContainer">
        <div class="gridItem">1</div>
        <div class="gridItem">2</div>
        <div class="gridItem">3</div>
        <div class="gridItem">4</div>
        <div class="gridItem">5</div>
        <div class="gridItem">6</div>
    </div>
</body>

</html>
